# ╭──────────────────────────────────────ImplementationGuide───────────────────────────────────────╮
# │  Properties below build the ImplementationGuide resource.                                      │
# │  See: https://fshschool.org/docs/sushi/configuration/                                           │
# ╰────────────────────────────────────────────────────────────────────────────────────────────────╯
# The id is also the ehealth-environment identifier carried by ehealth-base and
# ehealth-base-environment on every definitional resource here — keep the two in step.
id: dk.ehealth.sundhed.fhir.ig.testdata
canonical: http://ehealth.sundhed.dk/fhir/testdata
name: FUTTestData
title: FUT test data
status: draft # draft | active | retired | unknown
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+

releaseLabel: ci-build # ci-build | draft | qa-preview | ballot | trial-use | release | update | normative+trial-use

description: Test data resources for the Danish eHealth Infrastructure, defined in FSH against the profiles of its Implementation Guide.

publisher:
  name: Den telemedicinske infrastruktur (eHealth Infrastructure)
  url: http://ehealth.sundhed.dk

# NO IG-LEVEL jurisdiction, ON PURPOSE.
# The IG Publisher propagates this value onto the conformance resources in the guide, OVERWRITING
# whatever they carry. ehealth-plandefinition and friends bind jurisdiction to
# http://ehealth.sundhed.dk/vs/jurisdiction, whose codes are healthcare-act, service-act and
# elderly-act — legal acts, not countries. So setting the usual urn:iso:std:iso:3166#DK here
# replaced the correct healthcare-act on all 18 definitional resources and produced 18 validation
# errors. Leaving it unset lets each resource keep the jurisdiction its own FSH sets.

# ╭────────────────────────────────────────Dependencies────────────────────────────────────────────╮
# │  The core IG supplies every profile, extension, code system and value set used here. Nothing   │
# │  conformance-bearing is defined in this repository — only Instances.                           │
# ╰────────────────────────────────────────────────────────────────────────────────────────────────╯
dependencies:
  dk.ehealth.sundhed.fhir.ig.core:
    version: 10.0.2
    uri: http://ehealth.sundhed.dk/fhir/ImplementationGuide/dk.ehealth.sundhed.fhir.ig.core
  # The core IG's own dependencies. SUSHI does not resolve a dependency's dependencies, so
  # profiles the core IG slices against (e.g. dk-core-sor-identifier on Organization.identifier)
  # only resolve if these are declared here too. Keep the versions in step with the core IG.
  hl7.fhir.dk.core: 3.6.0
  hl7.fhir.uv.sdc: 2.7.0

# Page tree. definition.page.page recurses, so pages nest arbitrarily deep — unlike groups,
# which are flat. Declared explicitly so each page gets a real title rather than one derived
# from its filename.
pages:
  index.md:
    title: Home
  artifacts-grouped.md:
    title: Artifacts Summary
  downloads.md:
    title: Downloads

menu:
  Home: index.html
  Artifacts Summary: artifacts-grouped.html
  Downloads: downloads.html

# GENERATED by scripts/make-groups.js — do not hand-edit.
# Sections of the rendered artifacts page (mode: category).
# One section per FHIR R4 module.
# The module comes from structuredefinition-category on each core StructureDefinition, so the
# taxonomy is the spec's own, not a local choice.
# The data loader does not read any of this. Order below is the order the sections render in.
groups:
  BaseIndividuals:
    name: "Base.Individuals"
    description: "The people the test data is about."
    resources:
      - Patient/p01
      - Patient/p02
      - Patient/p03
      - Patient/p04
      - Patient/p05
      - Patient/p06
      - Patient/p07
      - Patient/p08
      - Patient/p09
      - Patient/p10
      - Practitioner/practitioner-fob
      - Practitioner/practitioner-kpro
      - Practitioner/practitioner-placeholder
      - Practitioner/practitioner-telma
  BaseEntities:
    name: "Base.Entities"
    description: "Organizations the definitions refer to."
    resources:
      - Organization/org-region-hovedstaden
      - Organization/org-region-midtjylland
  BaseManagement:
    name: "Base.Management"
    description: "The episode of care the plan is delivered under, and that every record of care refers back to."
    resources:
      - EpisodeOfCare/p01-eoc1
      - EpisodeOfCare/p01-eoc2
  ClinicalCareProvision:
    name: "Clinical.Care Provision"
    description: "The plan as delivered to the patient: the care plan, the service requests it consists of, and the care team responsible."
    resources:
      - CarePlan/p01-cp1
      - CarePlan/p01-cp2
      - ServiceRequest/p01-cp1-sr-closing
      - ServiceRequest/p01-cp1-sr-extra-head
      - ServiceRequest/p01-cp1-sr-extra-pulse
      - ServiceRequest/p01-cp1-sr-extra-questionnaire
      - ServiceRequest/p01-cp1-sr-extra-sat-pulse
      - ServiceRequest/p01-cp1-sr-extra-saturation
      - ServiceRequest/p01-cp1-sr-head
      - ServiceRequest/p01-cp1-sr-intro
      - ServiceRequest/p01-cp1-sr-pulse
      - ServiceRequest/p01-cp1-sr-questionnaire
      - ServiceRequest/p01-cp1-sr-sat-pulse
      - ServiceRequest/p01-cp1-sr-sat-pulse-intro
      - ServiceRequest/p01-cp1-sr-sat-pulse-prep
      - ServiceRequest/p01-cp1-sr-saturation
      - ServiceRequest/p01-cp2-sr-closing
      - ServiceRequest/p01-cp2-sr-extra-head
      - ServiceRequest/p01-cp2-sr-extra-pulse
      - ServiceRequest/p01-cp2-sr-extra-questionnaire
      - ServiceRequest/p01-cp2-sr-extra-sat-pulse
      - ServiceRequest/p01-cp2-sr-extra-saturation
      - ServiceRequest/p01-cp2-sr-head
      - ServiceRequest/p01-cp2-sr-intro
      - ServiceRequest/p01-cp2-sr-pulse
      - ServiceRequest/p01-cp2-sr-questionnaire
      - ServiceRequest/p01-cp2-sr-sat-pulse
      - ServiceRequest/p01-cp2-sr-sat-pulse-intro
      - ServiceRequest/p01-cp2-sr-sat-pulse-prep
      - ServiceRequest/p01-cp2-sr-saturation
      - CareTeam/careteam-fob
      - CareTeam/careteam-kpro
      - CareTeam/careteam-placeholder
      - CareTeam/careteam-telma
  ClinicalDiagnostics:
    name: "Clinical.Diagnostics"
    description: "What the patient submitted: the measurements and the questionnaire responses."
    resources:
      - Observation/p01-cp1-pulse
      - Observation/p01-cp1-sat
      - Observation/p01-cp2-pulse
      - Observation/p01-cp2-sat
      - QuestionnaireResponse/p01-cp1-qr
      - QuestionnaireResponse/p01-cp2-qr
  ClinicalSummary:
    name: "Clinical.Summary"
    description: "The clinical record: the diagnosis each episode addresses, and the triage result of each submission. The impressions are not loaded — automated processing creates them, and the ones here record what it should produce."
    resources:
      - Condition/p01-eoc1-cond
      - Condition/p01-eoc2-cond
      - ClinicalImpression/p01-cp1-ci-pulse
      - ClinicalImpression/p01-cp1-ci-qr
      - ClinicalImpression/p01-cp1-ci-sat
      - ClinicalImpression/p01-cp2-ci-pulse
      - ClinicalImpression/p01-cp2-ci-qr
      - ClinicalImpression/p01-cp2-ci-sat
  FoundationSecurity:
    name: "Foundation.Security"
