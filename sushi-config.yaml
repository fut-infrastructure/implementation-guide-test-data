# ╭──────────────────────────────────────ImplementationGuide───────────────────────────────────────╮
# │  Properties below build the ImplementationGuide resource.                                      │
# │  See: https://fshschool.org/docs/sushi/configuration/                                           │
# ╰────────────────────────────────────────────────────────────────────────────────────────────────╯
# The id is also the ehealth-environment identifier carried by ehealth-base and
# ehealth-base-environment on every definitional resource here — keep the two in step.
id: dk.ehealth.sundhed.fhir.ig.testdata
canonical: http://ehealth.sundhed.dk/fhir/testdata
name: FUTTestData
title: FUT test data
status: draft # draft | active | retired | unknown
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+

releaseLabel: ci-build # ci-build | draft | qa-preview | ballot | trial-use | release | update | normative+trial-use

description: Test data resources for the Danish eHealth Infrastructure, defined in FSH against the profiles of its Implementation Guide.

publisher:
  name: Den telemedicinske infrastruktur (eHealth Infrastructure)
  url: http://ehealth.sundhed.dk

# NO IG-LEVEL jurisdiction, ON PURPOSE.
# The IG Publisher propagates this value onto the conformance resources in the guide, OVERWRITING
# whatever they carry. ehealth-plandefinition and friends bind jurisdiction to
# http://ehealth.sundhed.dk/vs/jurisdiction, whose codes are healthcare-act, service-act and
# elderly-act — legal acts, not countries. So setting the usual urn:iso:std:iso:3166#DK here
# replaced the correct healthcare-act on all 18 definitional resources and produced 18 validation
# errors. Leaving it unset lets each resource keep the jurisdiction its own FSH sets.

# ╭────────────────────────────────────────Dependencies────────────────────────────────────────────╮
# │  The core IG supplies every profile, extension, code system and value set used here. Nothing   │
# │  conformance-bearing is defined in this repository — only Instances.                           │
# ╰────────────────────────────────────────────────────────────────────────────────────────────────╯
dependencies:
  dk.ehealth.sundhed.fhir.ig.core:
    version: 10.0.2
    uri: http://ehealth.sundhed.dk/fhir/ImplementationGuide/dk.ehealth.sundhed.fhir.ig.core
  # The core IG's own dependencies. SUSHI does not resolve a dependency's dependencies, so
  # profiles the core IG slices against (e.g. dk-core-sor-identifier on Organization.identifier)
  # only resolve if these are declared here too. Keep the versions in step with the core IG.
  hl7.fhir.dk.core: 3.6.0
  hl7.fhir.uv.sdc: 2.7.0

menu:
  Home: index.html
  Artifacts: artifacts.html

# GENERATED by scripts/make-groups.js — do not hand-edit.
# Sections of the rendered artifacts page (mode: category).
# One section per FHIR R4 module.
# The module comes from structuredefinition-category on each core StructureDefinition, so the
# taxonomy is the spec's own, not a local choice.
# The data loader does not read any of this. Order below is the order the sections render in.
groups:
  BaseIndividuals:
    name: "Base.Individuals"
    description: "The people the test data is about."
    resources:
      - Patient/patient
      - Practitioner/practitioner
  BaseEntities:
    name: "Base.Entities"
    description: "Organizations the definitions refer to."
    resources:
      - Organization/org-region-hovedstaden
      - Organization/org-region-midtjylland
  BaseManagement:
    name: "Base.Management"
    description: "The episode of care the plan is delivered under, and that every record of care refers back to."
    resources:
      - EpisodeOfCare/episodeofcare
      - EpisodeOfCare/episodeofcare-completed
  ClinicalSummary:
    name: "Clinical.Summary"
    description: "The clinical record: diagnoses."
    resources:
      - Condition/condition
      - Condition/condition-completed
  ClinicalCareProvision:
    name: "Clinical.Care Provision"
    description: "The plan as delivered: care plan, service requests, goals, care team."
    resources:
      - CareTeam/careteam
  SpecializedDefinitionalArtifacts:
    name: "Specialized.Definitional Artifacts"
    description: "The plan, the activities it is built from, the questionnaire and the automated-processing rules."
    resources:
      - PlanDefinition/plandefinition
      - ActivityDefinition/ad-closing
      - ActivityDefinition/ad-extra-head
      - ActivityDefinition/ad-extra-pulse
      - ActivityDefinition/ad-extra-questionnaire
      - ActivityDefinition/ad-extra-sat-pulse
      - ActivityDefinition/ad-extra-saturation
      - ActivityDefinition/ad-head
      - ActivityDefinition/ad-intro
      - ActivityDefinition/ad-pulse
      - ActivityDefinition/ad-questionnaire
      - ActivityDefinition/ad-sat-pulse
      - ActivityDefinition/ad-sat-pulse-intro
      - ActivityDefinition/ad-sat-pulse-prep
      - ActivityDefinition/ad-saturation
      - Questionnaire/questionnaire
      - Library/library-observation-absolute-triage
      - Library/library-questionnaire-triage

parameters:
  path-resource:
    - input/fsh
